services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - blog_data:/app/data
      - blog_uploads:/app/uploads
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - DATABASE_URL=sqlite:///data/blog.db
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_BASE_URL=${AI_BASE_URL:-https://api.deepseek.com}
      - AI_MODEL=${AI_MODEL:-deepseek-v4-flash}
      - UPLOAD_DIR=/app/uploads
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - SITE_DOMAIN=${SITE_DOMAIN:-gianniiss.top}
      - SITE_URL=${SITE_URL:-https://gianniiss.top}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    # 让容器内 nginx 能反代到宿主机上的服务（如抢座工具 :8123）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # 笔记站：构建 Quartz 后取消注释下方两行，把路径换成你的 public 目录
      # - /home/ubuntu/notes-content/public:/usr/share/nginx/notes:ro
      # SSL 证书：如已用 certbot 获取证书，取消注释下行
      # - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  blog_data:
  blog_uploads:
