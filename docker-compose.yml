services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - blog_data:/app/data
      - blog_uploads:/app/uploads
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - DATABASE_URL=sqlite:///data/blog.db
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_BASE_URL=${AI_BASE_URL:-https://api.deepseek.com}
      - AI_MODEL=${AI_MODEL:-deepseek-v4-flash}
      - UPLOAD_DIR=/app/uploads
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
      - TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GITHUB_CALLBACK_URL=${GITHUB_CALLBACK_URL:-}
      - SITE_NAME=${SITE_NAME:-我的个人主页}
      - SITE_DOMAIN=${SITE_DOMAIN:-gianniiss.top}
      - SITE_URL=${SITE_URL:-https://blog.gianniiss.top}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    # 绑到 docker 网关地址：Caddy 网关（host.docker.internal→172.17.0.1）够得着，但不对公网开放
    ports:
      - "172.17.0.1:8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  blog_data:
  blog_uploads:
