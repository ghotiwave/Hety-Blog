server {
    listen 80;
    listen 443 ssl;
    server_name _;
    client_max_body_size 10M;

    # SSL: 使用 certbot 获取证书后取消注释以下两行
    # ssl_certificate /etc/letsencrypt/live/your-domain/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your-domain/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 30s;
    }

    location /uploads/ {
        proxy_pass http://backend:8000;
    }

    location /notes {
        root /usr/share/nginx;
        index index.html;
        try_files $uri $uri.html $uri/ /notes/index.html;
    }
}

# ── zju 抢座工具反代（可选）─────────────────────────────────────────────
# 把子域名 zju.<域名> 反代到宿主机上独立运行的抢座网页（systemd, 0.0.0.0:8123）。
# 与主站完全独立；CI 的 sed 会自动解注释下面的 ssl_* 并把 your-domain 换成实际域名。
# 需配合：1) docker-compose 的 frontend 加 extra_hosts: host.docker.internal:host-gateway
#         2) 证书已包含 zju.<域名>（certbot --expand）
server {
    listen 443 ssl;
    server_name zju.your-domain;

    # ssl_certificate /etc/letsencrypt/live/your-domain/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your-domain/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://host.docker.internal:8123;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
}
